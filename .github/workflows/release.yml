# Versioning and publishing, following https://changesets.dev/guide/automating (token-based publishing).
# - Pending changesets: open or update the "chore: release @speedernet/ui" pull request.
# - No pending changesets and an unpublished version: publish it to Verdaccio, push the git tag
#   and create the GitHub release.
name: Release

on:
  push:
    branches: [main]

# Reset permissions; each job gets only what it needs
permissions: {}

# One run at a time per branch; a newer push waits instead of cancelling a publish in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Every dependency is resolved through the private registry, which requires a token
          registry-url: https://verdaccio.speedernet.io/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}

      # CI only runs on pull requests: this checks main itself after every merge
      - name: Test
        run: npm test

      - name: Build the library
        run: npm run build:ui

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit version changes (changesets/action/version)
      pull-requests: write # to create the pull request (changesets/action/version)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://verdaccio.speedernet.io/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}

      - name: Version packages
        uses: changesets/action/version@v2.1.2
        with:
          script: npm run version-packages
          pr-title: 'chore: release @speedernet/ui'
          commit-message: 'chore: release @speedernet/ui'

  publish:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the git tag and create the GitHub release (changesets/action/publish)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://verdaccio.speedernet.io/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}

      # `changeset publish` publishes dist/ui (publishConfig.directory in projects/ui/package.json)
      - name: Build the library
        run: npm run build:ui

      - name: Publish packages
        uses: changesets/action/publish@v2.1.2
        with:
          script: npx changeset publish
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
