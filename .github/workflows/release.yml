name: Release

on:
  push:
    branches: [main]

# One release run at a time; a newer push waits instead of cancelling a publish in progress
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # Push the version branch and the git tags, open the "Version Packages" pull request
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://verdaccio.speedernet.io/

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}

      - name: Test
        run: npm test

      # With pending changesets: opens or updates the "Version Packages" pull request.
      # Without (that pull request was just merged): publishes the new version and pushes its git tag.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore: release @speedernet/ui'
          commit: 'chore: release @speedernet/ui'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
