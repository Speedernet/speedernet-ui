name: CI

# Pull requests only: once merged, main is checked again by the Release workflow (tests and build)
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so Changesets can compare the branch with main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Every dependency is resolved through the private registry, which requires a token
          registry-url: https://verdaccio.speedernet.io/

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}

      - name: Check formatting
        run: npx prettier --check .

      - name: Check for a Changesets file
        # The release pull request consumes the changesets instead of adding one
        if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
        run: npx changeset status --since=origin/${{ github.base_ref }}

      - name: Test
        run: npm test

      - name: Build the library
        run: npm run build:ui
